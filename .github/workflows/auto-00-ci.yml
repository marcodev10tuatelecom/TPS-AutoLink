name: AUTO-00 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Rust 1.98.0 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Toolchain evidence
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Release build
        run: cargo build --workspace --release

      - name: Simulator self-test
        run: cargo run -p tps-auto-simulator --release -- --self-test
