name: AUTO-00 Canonical Control Bootstrap

on:
  push:
    paths:
      - '.bootstrap/control.ready'

permissions:
  contents: write

jobs:
  assemble-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Assemble and verify canonical control
        shell: bash
        run: |
          set -Eeuo pipefail
          cat \
            .bootstrap/control.part01.b64 \
            .bootstrap/control.part02.b64 \
            .bootstrap/control.part03.b64 \
            .bootstrap/control.part04.b64 \
            > /tmp/tps-autolink-control.b64
          base64 --decode /tmp/tps-autolink-control.b64 > TPS-AUTOLINK-PROJECT-CONTROL.md
          printf '%s  %s\n' \
            'fbec3a2551b20c410ebaabd88af167e02198e637f23b1fa480b9724cad1b3bcc' \
            'TPS-AUTOLINK-PROJECT-CONTROL.md' | sha256sum -c -

      - name: Commit canonical control
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TPS-AUTOLINK-PROJECT-CONTROL.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(auto-00): install canonical project control'
          git push
