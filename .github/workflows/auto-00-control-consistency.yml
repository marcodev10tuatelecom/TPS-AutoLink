name: AUTO-00 Control Consistency Fix

# One-shot corrective workflow for AUTO-00 canonical-state consistency.
on:
  push:
    paths:
      - '.github/workflows/auto-00-control-consistency.yml'

permissions:
  contents: write

jobs:
  fix-control-signature:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Align logical signature with canonical current state
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('TPS-AUTOLINK-PROJECT-CONTROL.md')
          text = path.read_text(encoding='utf-8')
          marker = '# 72. ASSINATURA LÓGICA DO CONTROLE'
          if text.count(marker) != 1:
              raise SystemExit('expected exactly one section 72 marker')
          before, section = text.split(marker, 1)
          old = 'ACTIVE_GATE: AUTO-00'
          if section.count(old) != 1:
              raise SystemExit('expected exactly one stale ACTIVE_GATE in section 72')
          section = section.replace(old, 'ACTIVE_GATE: AUTO-01', 1)
          path.write_text(before + marker + section, encoding='utf-8', newline='\n')
          PY

          CONTROL_SHA="$(sha256sum TPS-AUTOLINK-PROJECT-CONTROL.md | awk '{print $1}')"
          python3 - "$CONTROL_SHA" <<'PY'
          from pathlib import Path
          import sys

          new_sha = sys.argv[1]
          path = Path('SHA256SUMS.txt')
          lines = path.read_text(encoding='utf-8').splitlines()
          target = 'TPS-AUTOLINK-PROJECT-CONTROL.md'
          matches = [i for i, line in enumerate(lines) if line.endswith('  ' + target)]
          if len(matches) != 1:
              raise SystemExit('expected exactly one control hash entry')
          lines[matches[0]] = f'{new_sha}  {target}'
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY

          grep -A20 '^# 72\. ASSINATURA LÓGICA DO CONTROLE' TPS-AUTOLINK-PROJECT-CONTROL.md | grep -F 'ACTIVE_GATE: AUTO-01'
          sha256sum -c SHA256SUMS.txt

      - name: Commit consistency fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TPS-AUTOLINK-PROJECT-CONTROL.md SHA256SUMS.txt
          git diff --cached --quiet && exit 0
          git commit -m 'docs(auto-00): align canonical active-gate signature'
          git push
